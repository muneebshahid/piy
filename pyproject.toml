[project]
name = "tile-runtime"
version = "0.1.0"
description = "A small Python-native runtime for tool-using agent sessions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "openai>=2.52.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
    "ty>=0.0.65",
]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
possibly-unresolved-reference = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
missing-type-argument = "error"
division-by-zero = "error"
blanket-ignore-comment = "error"
unsupported-dynamic-base = "error"
missing-override-decorator = "error"

[tool.ruff.lint]
extend-select = ["ARG", "D1", "D401", "FBT", "PT", "PTH"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tile"
module-root = ""
